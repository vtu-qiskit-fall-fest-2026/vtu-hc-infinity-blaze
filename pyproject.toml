[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumgreen-ai"
version = "0.1.0"
description = "Solar energy scheduling and QAOA simulation demonstration"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "scipy>=1.11",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]
